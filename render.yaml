# Render Blueprint for the Zoro backend (MCP gateway, Sentinel auditor, Attack Lab, Console and public APIs).
# Create it once from the Render Dashboard: New → Blueprint → this repository. Every later push to main redeploys it.
# Values marked `sync: false` are entered in the Dashboard (Render asks for them when the Blueprint is first created;
# add or change them later under the service's Environment tab). See .env.example for what each variable does.
services:
  - type: web
    name: zoro-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    # The pnpm workspace lives at the repository root; install only the daemon and the packages it depends on.
    buildCommand: corepack enable pnpm || npm install -g pnpm@10.18.3; pnpm install --frozen-lockfile --filter "@zoro/daemon..."
    startCommand: cd Backend/daemon && node --import tsx src/main.ts
    # Answers from memory only (no database, chain or auditor), so it is safe for health checks and keep-alive pings.
    healthCheckPath: /healthz
    # Frontend-only changes do not redeploy the backend.
    buildFilter:
      paths:
        - Backend/**
        - Blockchain/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    envVars:
      # --- Runtime ---
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: ZORO_HOST
        value: 0.0.0.0
      # Render's free instances have no persistent disk: this directory is wiped on every restart and redeploy.
      - key: ZORO_DATA_DIR
        value: /tmp/zoro-data
      - key: ZORO_EPHEMERAL_STORAGE
        value: "true"

      # --- Web app (Vercel) ---
      - key: ZORO_WEB_ORIGIN
        value: https://zoro-mcp-guard.vercel.app
      - key: ZORO_PUBLIC_URL
        value: https://zoro-mcp-guard.vercel.app
      - key: ZORO_CORS_ORIGINS
        value: https://zoro-mcp-guard.vercel.app

      # --- Access tokens: generated once by Render and kept across deploys ---
      - key: ZORO_CONSOLE_TOKEN
        generateValue: true
      - key: ZORO_GATEWAY_TOKEN
        generateValue: true

      # --- Auditor identity: must stay fixed, or attestations change signer on every restart ---
      - key: ZORO_AUDITOR_PRIVATE_KEY
        sync: false

      # --- Sentinel AI layer and Ask Zoro ---
      - key: GROQ_API_KEY
        sync: false
      - key: SENTINEL_MODEL
        value: openai/gpt-oss-120b
      - key: ASK_MODEL
        value: openai/gpt-oss-120b
      - key: ASK_GUARD_MODEL
        value: openai/gpt-oss-20b
      - key: SENTINEL_REQUIRE_AI
        value: "true"
      - key: SENTINEL_SEAL_LIFETIME_DAYS
        value: "28"

      # --- ENSv2 registry (Ethereum Sepolia) ---
      - key: ENS_NETWORK
        value: sepolia
      - key: ENS_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      # Public name and contract addresses written by `pnpm setup:ens`: safe to commit. The operator key, which
      # registers namespaces for newly protected servers, is entered in the Dashboard.
      - key: ZORO_ENS_ROOT
        value: zoro-registry.eth
      - key: ZORO_ENS_RESOLVER
        value: "0x5d5E256Abc73487a76D1B76f7769C92b07cc52Ac"
      - key: ZORO_ENS_REGISTRY
        value: "0x0C060388fB376C1CfD77ae070f4fD30d2B20F0ea"
      - key: ZORO_ENS_LAB_RESOLVER
        value: "0xabc17D74D77c3E3a467567F74B4d8f1302e1f466"
      - key: ENS_OPERATOR_PRIVATE_KEY
        sync: false

      # --- Hedera ledger (testnet) ---
      - key: HEDERA_NETWORK
        value: testnet
      # Public identifiers (account, topics, token): safe to commit. The operator key is entered in the Dashboard.
      - key: HEDERA_OPERATOR_ID
        value: 0.0.11329412
      - key: HEDERA_KEY_TYPE
        value: ecdsa
      - key: HEDERA_OPERATOR_KEY
        sync: false
      - key: HEDERA_REGISTRY_TOPIC_ID
        value: 0.0.11329769
      - key: HEDERA_LAB_TOPIC_ID
        value: 0.0.11329770
      - key: HEDERA_ORG_TOPIC_ID
        value: 0.0.11329771
      - key: HEDERA_BADGE_TOKEN_ID
        value: 0.0.11329772

      # --- World ID (Human Seal): staging = World ID Simulator (the live demo); sandbox = World ID Sandbox app; production = World App ---
      - key: WORLD_ENVIRONMENT
        value: staging
      # App and relying-party IDs are public (they are sent to the browser); the signing key is entered in the Dashboard.
      - key: WORLD_APP_ID
        value: app_72e44df4d18c8dae291e479c4baedbf0
      - key: WORLD_RP_ID
        value: rp_1a49119b2c0262d1
      - key: WORLD_SIGNING_KEY
        sync: false

      # --- Organizations: signs invites and member device tokens (generated once, kept across deploys) ---
      - key: ZORO_ORG_SECRET
        generateValue: true
