name: Keep backend awake

# Render's free web services sleep after 15 minutes without inbound traffic and take about a minute to wake.
# Pinging the health endpoint every 10 minutes keeps the backend warm, with room for delayed scheduled runs.
# Notes: scheduled workflows only run from the default branch, can be delayed or dropped when GitHub is busy,
# and are disabled automatically after 60 days without repository activity in a public repository.

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour, when GitHub's scheduler is busiest.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the backend health endpoint
        env:
          # Set under Settings → Secrets and variables → Actions → Variables, e.g. https://zoro-backend-r4qd.onrender.com
          BACKEND_URL: ${{ vars.ZORO_BACKEND_URL || secrets.ZORO_BACKEND_URL }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            msg="Set the ZORO_BACKEND_URL repository variable to the Render backend URL to enable keep-alive."
            if [ "$MANUAL" = "true" ]; then echo "::error title=Keep-alive not configured::$msg"; exit 1; fi
            echo "::warning title=Keep-alive not configured::$msg"
            exit 0
          fi
          url="${BACKEND_URL%/}/healthz"
          # A sleeping instance takes about a minute to wake: up to 3 attempts of 90 seconds each.
          if body=$(curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$url"); then
            echo "Backend is up: $url → $body"
          else
            echo "::error title=Backend not responding::$url did not answer with HTTP 200 after 3 attempts."
            exit 1
          fi
